<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="858" height="258" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">yjs-lens: does convergence actually hold?</text>

  <text x="150" y="60" text-anchor="middle" font-size="11" fill="#57606a">same updates, random orders</text>
  <rect x="60" y="70" width="180" height="34" rx="6" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="150" y="91" text-anchor="middle" font-size="10" fill="#0b3d91">order A: u1, u2, u3</text>
  <rect x="60" y="112" width="180" height="34" rx="6" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="150" y="133" text-anchor="middle" font-size="10" fill="#0b3d91">order B: u3, u1, u2</text>
  <rect x="60" y="154" width="180" height="34" rx="6" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="150" y="175" text-anchor="middle" font-size="10" fill="#0b3d91">order C: u2, u3, u1</text>

  <path d="M240 87 H330" stroke="#57606a" stroke-width="2" marker-end="url(#arrow4)"/>
  <path d="M240 129 H330" stroke="#57606a" stroke-width="2" marker-end="url(#arrow4)"/>
  <path d="M240 171 H330" stroke="#57606a" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="330" y="90" width="200" height="80" rx="8" fill="#fff7e6" stroke="#d4a017"/>
  <text x="430" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5200">checkConvergence()</text>
  <text x="430" y="133" text-anchor="middle" font-size="10" fill="#334">materialize via toJSON()</text>
  <text x="430" y="147" text-anchor="middle" font-size="10" fill="#334">across N random orderings</text>

  <path d="M530 130 H600" stroke="#57606a" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="600" y="90" width="220" height="35" rx="7" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="710" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#116329">converged: same content</text>

  <rect x="600" y="130" width="220" height="35" rx="7" fill="#ffebe9" stroke="#cf222e"/>
  <text x="710" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#82071e">divergence: reported diff</text>

  <text x="430" y="215" text-anchor="middle" font-size="11" fill="#57606a">Yjs accepts updates out of causal order by design -- this proves your updates</text>
  <text x="430" y="233" text-anchor="middle" font-size="11" fill="#57606a">actually converge to the same document, not just that Y.logUpdate() didn't crash.</text>

  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
